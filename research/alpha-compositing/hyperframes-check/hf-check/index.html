<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Layer 1 (bottom): background video -->
      <video
        id="bg"
        class="clip"
        src="assets/background.mp4"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        muted
        playsinline
        style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 1"
      ></video>

      <!-- Layer 2 (middle, rear): mid-gray text positioned to overlap the presenter -->
      <div
        id="behind-text"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        style="position: absolute; top: 380px; left: 460px; width: 1000px; height: 400px; z-index: 2; color: #808080; font-size: 140px; font-weight: 700; line-height: 1.1; text-align: center; display: flex; align-items: center; justify-content: center;"
      >
        HF CONTRACT
      </div>

      <!-- Layer 3 (top): ProRes 4444 alpha cutout -->
      <video
        id="cutout"
        class="clip"
        src="assets/cutout-alpha.mov"
        data-start="0"
        data-duration="5"
        data-track-index="2"
        muted
        playsinline
        style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 3"
      ></video>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
